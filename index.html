<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#EDEFF0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14171A" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Learn the Sri Lankan A/L ICT unit on IoT, embedded systems and Arduino by building circuits and running real code, from knowing nothing to exam-ready."
    />
    <title>The Bench — A/L ICT: IoT, Embedded Systems &amp; Arduino</title>
  </head>
  <body>
    <!--
      THESIS: A breadboard, not a course website. Every claim the syllabus makes is
      seated on the board and made to run; refuses the ed-tech card grid on a soft
      gradient, and refuses the dark-IDE hacker skin.
      OWN-WORLD: Cool ABS-white plastic (black ABS in dark), shadowed 0.1in hole
      matrix on a 24px pitch, saturated silkscreen rails (+ red / - blue) down both
      page edges, a DIP centre channel splitting the column, jumper-wire colours as
      the categorical palette, Archivo variable for silkscreen legends and UI,
      JetBrains Mono for every number and line of code.
      STORY: A student who has never seen a board understands a concept, seats it on
      the bench, runs it, is told exactly why they were wrong, and leaves knowing
      what to review next.
      FIRST VIEWPORT: Power rails bleed off both edges. The bench header states the
      unit and the single continuous mastery strip of 100 holes. Below the centre
      channel, module DIPs straddle the ravine, each showing occupied holes rather
      than a percentage bar. Continue Learning is the seated, energised component.
      FORM: The Breadboard, candidate 1 of my grounded list, user-pinned over the
      roll (seed 697106d5, assigned 6 = The Drawing Sheet). Raised by: acetate
      overlay callouts, REVEAL as a system state, one continuous physical mastery
      axis, state in three channels never colour alone, saturated colour spent on
      one live element per screen.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the
      finish review, the verdict, and DESIGN.md
    -->
    <script>
      // Set the board colour before first paint. Without this a student whose
      // phone is in night mode sees a white flash on every page load.
      (function () {
        try {
          var raw = localStorage.getItem('the-bench:progress')
          var pref = raw ? JSON.parse(raw).state.theme : null
          var dark =
            pref === 'dark' ||
            (!pref && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
